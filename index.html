<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fichaya | Property & Facility Management in Lagos</title>
    <meta
      name="description"
      content="Fichaya manages cleaning, maintenance, power, staffing and vendor coordination for corporate and multi-tenant properties in Lagos — one accountable team."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#14161A" />

    <!-- Favicons -->
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />

    <!-- Social sharing (absolute URLs, canonical and JSON-LD are added by scripts/prerender.mjs) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fichaya" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:title" content="Fichaya | Property & Facility Management in Lagos" />
    <meta
      property="og:description"
      content="Cleaning, maintenance, power, staffing and vendor coordination for corporate and multi-tenant properties — one accountable team."
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fichaya — Your building should run smoothly. We make sure it does." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fichaya | Property & Facility Management in Lagos" />
    <meta
      name="twitter:description"
      content="Cleaning, maintenance, power, staffing and vendor coordination for corporate and multi-tenant properties — one accountable team."
    />
    <!--seo-head-->

    <!-- Start the hero photo download before the CSS and JS are parsed. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="./assets/hero-1400.webp"
      imagesrcset="./assets/hero-800.webp 800w, ./assets/hero-1400.webp 1400w, ./assets/hero-2752.webp 2752w"
      imagesizes="(max-width: 900px) calc(100vw - 32px), calc(100vw - 64px)"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
